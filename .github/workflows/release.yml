# Cuts a release: runs the tests, bumps the version in both plugin.json files, tags it, and
# moves `stable` to it. Students install from `stable`, so nothing merged to main
# reaches them until this runs. Installed copies only update when the version
# string changes, which is why the bump and the branch move happen together.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Full history, so the push can see that stable fast-forwards to main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Test
        run: for t in test/*.mjs; do node "$t"; done

      # The wbs-exercise npx launcher runs this repo's setup.mjs from a sparse
      # download of stable, so a release that moves or adds files setup reads
      # can break it without any change on its side. Its unit test treats this
      # checkout as stable, so an incompatible release stops here, before it
      # reaches students. Untracked, so the release commit below leaves it out.
      - uses: actions/checkout@v5
        with:
          repository: WebDev-WBSCodingSchool/wbs-exercise
          path: wbs-exercise

      - name: Test the npx launcher against this release
        working-directory: wbs-exercise
        run: npm test
        env:
          PLUGIN_CHECKOUT: ${{ github.workspace }}

      - name: Bump version
        id: bump
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
            // Both plugins share one version, so /instructor:add-exercise can
            // check that it matches the checkout it writes into.
            const paths = ["exercise/.claude-plugin/plugin.json", "instructor/.claude-plugin/plugin.json"];
            const plugin = JSON.parse(readFileSync(paths[0], "utf8"));
            const parts = plugin.version.split(".").map(Number);
            if (parts.length !== 3 || parts.some(Number.isNaN)) throw new Error(`not x.y.z: ${plugin.version}`);
            const i = ["major", "minor", "patch"].indexOf(process.argv[1]);
            parts[i] += 1;
            parts.fill(0, i + 1);
            const version = parts.join(".");
            for (const path of paths) {
              const manifest = JSON.parse(readFileSync(path, "utf8"));
              manifest.version = version;
              writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          ' "${{ inputs.bump }}"

      - name: Commit, tag, and publish to stable
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          # Atomic, so main, the tag, and stable either all move or none do.
          git push --atomic origin HEAD:main "v$VERSION" HEAD:stable
